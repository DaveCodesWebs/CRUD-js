<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Iphone Shop</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body class="bg-light text-dark">
    <header class="container py-4">
      <h1>IphoneShop</h1>
    </header>

    <main class="container">
      <h1 class="mb-4">Phone List</h1>

      <section class="bg-light p-4 rounded-4 border border-secondary">
        <div
          class="d-flex justify-content-between align-items-center mb-4 gap-3 flex-wrap"
        >
          <div class="input-group w-auto">
            <input
              type="text"
              id="search-input"
              class="form-control bg-light text-dark border-secondary"
              placeholder="Search..."
              oninput="handleSearch(event)"
            />

            <button type="button" class="btn btn-primary">
              <i data-lucide="search"></i>
            </button>
          </div>
          <div class="section2-input-group d-flex gap-2">
          <button
            type="button"
            id="delete-selected-btn"
            class="btn btn-danger d-flex align-items-center gap-2"
            onclick="deleteSelectedPhones()"
          >
            <i data-lucide="trash-2"></i>
            Delete Selected
          </button>

          <button
            type="button"
            id="bulk-edit-btn"
            class="btn btn-warning d-flex align-items-center gap-2"
            onclick="openBulkEditModal()"
          >
            <i data-lucide="edit"></i>
            Bulk Edit
          </button>

          <button
            type="button"
            id="add-phone-btn"
            class="btn btn-success d-flex align-items-center gap-2"
            onclick="openAddModal()"
          >
            <i data-lucide="plus"></i>
            Add Phone
          </button>
          </div>
        </div>

        <div class="table-responsive bg-light">
          <table
            class="table table-hover align-middle table-bordered table-striped"
          >
            <thead>
              <tr class="bg-light">
                <th>
                  <input
                    type="checkbox"
                    id="select-all"
                    onchange="handleSelectAll(event)"
                  />
                </th>

                <th>Id</th>
                <th>Name</th>
                <th>Storage</th>
                <th>RAM</th>
                <th>Refresh Rate</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="table-body"></tbody>
          </table>
        </div>

        <div
          class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3"
        >
          <div>
            <p class="mb-0">
              Showing

              <select
                id="items-per-page"
                class="form-select d-inline-block w-auto mx-2 bg-light text-dark border-secondary"
                onchange="handleItemsPerPage(event)"
              >
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="50">50</option>
              </select>

              products out of <span id="total-count">0</span>
            </p>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button
              type="button"
              id="prev-page"
              class="btn text-dark btn-outline-light"
              onclick="goToPrevPage()"
            >
              <i data-lucide="chevron-left"></i>
            </button>

            <div class="pagination d-flex gap-2 mb-0" id="pagination"></div>

            <button
              type="button"
              id="next-page"
              class="btn btn-outline-light text-dark"
              onclick="goToNextPage()"
            >
              <i data-lucide="chevron-right"></i>
            </button>
          </div>
        </div>
      </section>

      <section class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
              <h5 class="modal-title" id="modal-title">Add Phone</h5>

              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <form id="iphone-form" onsubmit="handleFormSubmit(event)">
                <div class="mb-3">
                  <label for="name" class="form-label">Name:</label>

                  <input
                    type="text"
                    id="name"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="(ex. Iphone 13)"
                  />
                </div>

                <div class="mb-3">
                  <label for="storage" class="form-label">Storage:</label>

                  <input
                    type="text"
                    id="storage"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="(ex. 256GB)"
                  />
                </div>

                <div class="mb-3">
                  <label for="ram" class="form-label">RAM:</label>

                  <input
                    type="text"
                    id="ram"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="(ex. 8GB)"
                  />
                </div>

                <div class="mb-3">
                  <label for="refresh-rate" class="form-label">
                    Refresh Rate:
                  </label>

                  <input
                    type="text"
                    id="refresh-rate"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="(ex. 60Hz)"
                  />
                </div>

                <div class="mb-3">
                  <label for="price" class="form-label">Price:</label>

                  <input
                    type="number"
                    id="price"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="(ex. 500)"
                  />
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                  >
                    Cancel
                  </button>

                  <button type="submit" class="btn btn-primary">
                    Save
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
